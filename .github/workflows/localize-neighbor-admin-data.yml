name: Localize neighbor admin data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/localize-neighbor-admin-data.yml'

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download ADM1 GeoJSON locally
        run: |
          set -euo pipefail
          mkdir -p map-assets/neighbors
          curl -L --fail --retry 3 'https://github.com/wmgeolab/geoBoundaries/raw/9469f09/releaseData/gbOpen/CHN/ADM1/geoBoundaries-CHN-ADM1_simplified.geojson' -o map-assets/neighbors/CHN-ADM1.geojson
          curl -L --fail --retry 3 'https://github.com/wmgeolab/geoBoundaries/raw/9469f09/releaseData/gbOpen/LAO/ADM1/geoBoundaries-LAO-ADM1_simplified.geojson' -o map-assets/neighbors/LAO-ADM1.geojson
          curl -L --fail --retry 3 'https://github.com/wmgeolab/geoBoundaries/raw/9469f09/releaseData/gbOpen/KHM/ADM1/geoBoundaries-KHM-ADM1_simplified.geojson' -o map-assets/neighbors/KHM-ADM1.geojson
      - name: Validate downloaded GeoJSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in Path('map-assets/neighbors').glob('*.geojson'):
              data=json.loads(p.read_text(encoding='utf-8'))
              assert data.get('type') == 'FeatureCollection', p
              assert len(data.get('features',[])) > 0, p
              print(p, len(data['features']))
          PY
      - name: Patch loader to same-origin files
        run: python tools/localize-neighbor-admin-data.py
      - name: Validate JS and cache
        run: |
          node --check neighbor-country-outlines.js
          grep -q "map-assets/neighbors/CHN-ADM1.geojson" neighbor-country-outlines.js
          grep -q "map-assets/neighbors/LAO-ADM1.geojson" neighbor-country-outlines.js
          grep -q "map-assets/neighbors/KHM-ADM1.geojson" neighbor-country-outlines.js
          grep -q "neighbor-country-outlines.js?v=3" index.html
      - name: Commit localized data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add map-assets/neighbors neighbor-country-outlines.js index.html
          git commit -m 'Bundle neighboring ADM1 boundaries locally'
          git push
