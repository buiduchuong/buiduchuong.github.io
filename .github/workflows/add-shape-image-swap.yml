name: Add shape image quick swap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-shape-image-swap.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python tools/patch-shape-image-swap.py
      - name: Validate
        run: |
          node --check flag-shape-tools.js
          node --check export-tools.js
          grep -q 'id="swapShapeFlagImages"' flag-shape-tools.js
          grep -q 'function swapSelectedImages' flag-shape-tools.js
          grep -q 'function copySelectedImageFromTarget' flag-shape-tools.js
          grep -q 'function selectNextImageShape' flag-shape-tools.js
          grep -q 'flag-shape-tools.js?v=6' export-tools.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flag-shape-tools.js export-tools.js
          git commit -m 'Add quick image switching for image shapes'
          git push
