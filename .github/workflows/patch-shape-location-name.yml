name: Patch shape location names

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-shape-location-name.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python tools/patch-shape-location-name.py
      - name: Validate
        run: |
          node --check flag-shape-tools.js
          node --check export-tools.js
          grep -q 'id="shapeFlagName"' flag-shape-tools.js
          grep -q "shapeFlagName:f.name||''" flag-shape-tools.js
          grep -q 'const title=x.name||typeLabel(x.type)' flag-shape-tools.js
          grep -q "flag-shape-tools.js?v=7" export-tools.js
          grep -q "load('export-tools.js?v=9')" index.html
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flag-shape-tools.js export-tools.js index.html
          git commit -m 'Add custom location names for image shapes'
          git push
