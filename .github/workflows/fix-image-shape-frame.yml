name: Finish fixed image shape frame

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-image-shape-frame.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove final auto-ratio fallback
        shell: python
        run: |
          from pathlib import Path

          p = Path('flag-shape-tools.js')
          s = p.read_text(encoding='utf-8')
          old = "if(ratio>0){f.imageRatio=ratio;f.lockRatio=true;f.h=clamp(f.w/ratio,20,280)}"
          new = "if(ratio>0)f.imageRatio=ratio;f.lockRatio=false"
          if old not in s:
            raise SystemExit('Missing CORS fallback auto-ratio fragment')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('export-tools.js')
          s = p.read_text(encoding='utf-8')
          old = 'flag-shape-tools.js?v=4'
          if old not in s:
            raise SystemExit('Missing flag-shape-tools v4 loader')
          p.write_text(s.replace(old, 'flag-shape-tools.js?v=5', 1), encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'export-tools.js?v=6'
          if old not in s:
            raise SystemExit('Missing export-tools v6 loader')
          p.write_text(s.replace(old, 'export-tools.js?v=7', 1), encoding='utf-8')

      - name: Validate exact fixed-frame behavior
        run: |
          node --check flag-shape-tools.js
          node --check export-tools.js
          grep -q "if(type==='image')return{w:80,h:50}" flag-shape-tools.js
          grep -q "lockRatio:type==='image'?false" flag-shape-tools.js
          grep -q "f.lockRatio=false" flag-shape-tools.js
          ! grep -q "f.h=clamp(f.w/ratio" flag-shape-tools.js
          grep -n "flag-shape-tools.js?v=5" export-tools.js
          grep -n "export-tools.js?v=7" index.html

      - name: Commit final fixed-frame behavior
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flag-shape-tools.js export-tools.js index.html
          git commit -m 'Make image shape dimensions fully independent'
          git push
