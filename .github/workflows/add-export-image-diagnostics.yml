name: Add export image diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-export-image-diagnostics.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch image failure diagnostics
        shell: python
        run: |
          from pathlib import Path

          # PNG 4K/8K exporter
          p=Path('png-export-fix.js')
          s=p.read_text(encoding='utf-8')
          old="function waitFonts(){return document.fonts?.ready||Promise.resolve()}"
          new=old+"\nfunction failureRecord(img,href,error,index){let id=img?.closest?.('[data-id]')?.getAttribute('data-id')||img?.id||`image-${index+1}`;let name='';try{const f=window.__VN_FLAG_SHAPES?.getAll?.().find(x=>x?.id===id);name=f?.tourName||f?.label||''}catch{}let url=href;try{url=new URL(href,location.href).href}catch{}return{id,name,href,url,error:error?.message||String(error)}}"
          if old not in s: raise SystemExit('png: waitFonts anchor missing')
          s=s.replace(old,new,1)
          old="failed.push({href,error:e?.message||String(e)})"
          new="failed.push(failureRecord(img,href,e,i))"
          if old not in s: raise SystemExit('png: failed push missing')
          s=s.replace(old,new,1)
          old="if(failed.length)throw new Error(`Có ${failed.length} ảnh chưa nhúng được. Hệ thống dừng xuất để tránh tạo PNG bị mất hình.`);return clone"
          new="if(failed.length){const err=new Error(`Có ${failed.length} ảnh chưa nhúng được. Hệ thống dừng xuất để tránh tạo PNG bị mất hình.`);err.imageFailures=failed;throw err}return clone"
          if old not in s: raise SystemExit('png: generic failure throw missing')
          s=s.replace(old,new,1)
          old="async function run(width,label,file){if(busy)return;setBusy(true);try{status(`${label}: chuẩn bị bản đồ và nhúng toàn bộ ảnh…`);"
          new="async function run(width,label,file){if(busy)return;setBusy(true);window.__VN_EXPORT_IMAGE_REPORT?.clear?.();try{status(`${label}: chuẩn bị bản đồ và nhúng toàn bộ ảnh…`);"
          if old not in s: raise SystemExit('png: run anchor missing')
          s=s.replace(old,new,1)
          old="}catch(e){console.error(e);status('Lỗi '+label+': '+(e?.message||e),true);alert('Không xuất '+label+': '+(e?.message||e))}finally{setBusy(false)}}"
          new="}catch(e){console.error(e);if(e?.imageFailures?.length)window.__VN_EXPORT_IMAGE_REPORT?.show?.(e.imageFailures,`xuất ${label}`);status('Lỗi '+label+': '+(e?.message||e)+(e?.imageFailures?.length?' · Xem Báo cáo ảnh lỗi bên dưới.':''),true);alert('Không xuất '+label+': '+(e?.message||e)+(e?.imageFailures?.length?'\\n\\nDanh sách URL ảnh lỗi đã hiện ở mục Báo cáo ảnh lỗi.':''))}finally{setBusy(false)}}"
          if old not in s: raise SystemExit('png: catch anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # SVG/PDF exporter
          p=Path('advanced-export-tools.js')
          s=p.read_text(encoding='utf-8')
          old="function waitFonts(){return document.fonts?.ready||Promise.resolve()}"
          new=old+"\nfunction failureRecord(img,href,error,index){let id=img?.closest?.('[data-id]')?.getAttribute('data-id')||img?.id||`image-${index+1}`;let name='';try{const f=window.__VN_FLAG_SHAPES?.getAll?.().find(x=>x?.id===id);name=f?.tourName||f?.label||''}catch{}let url=href;try{url=new URL(href,location.href).href}catch{}return{id,name,href,url,error:error?.message||String(error)}}"
          if old not in s: raise SystemExit('advanced: waitFonts anchor missing')
          s=s.replace(old,new,1)
          old="failed.push({href,error:err?.message||String(err)})"
          new="failed.push(failureRecord(image,href,err,i))"
          if old not in s: raise SystemExit('advanced: failed push missing')
          s=s.replace(old,new,1)
          old="if(failed.length)status(`Đã xuất SVG, nhưng ${failed.length} ảnh URL bị máy chủ chặn CORS nên vẫn phải giữ link ngoài. Hãy dùng ảnh từ máy để file độc lập 100%.`,true);"
          new="if(failed.length){window.__VN_EXPORT_IMAGE_REPORT?.show?.(failed,'xuất SVG');status(`Đã xuất SVG, nhưng ${failed.length} ảnh bị lỗi khi nhúng. Xem Báo cáo ảnh lỗi bên dưới để biết ID và URL.`,true);}"
          if old not in s: raise SystemExit('advanced: SVG status missing')
          s=s.replace(old,new,1)
          old="if(failed.length)status(`✓ Đã xuất PDF Vector. ${failed.length} ảnh URL bị CORS có thể không xuất được; dùng ảnh local để chắc chắn.`,true);"
          new="if(failed.length){window.__VN_EXPORT_IMAGE_REPORT?.show?.(failed,'xuất PDF Vector');status(`✓ Đã xuất PDF Vector nhưng ${failed.length} ảnh có thể bị thiếu. Xem Báo cáo ảnh lỗi bên dưới để biết ID và URL.`,true);}"
          if old not in s: raise SystemExit('advanced: PDF status missing')
          s=s.replace(old,new,1)
          old="async function run(fn){if(busy)return;setBusy(true);try{await fn()}"
          new="async function run(fn){if(busy)return;setBusy(true);window.__VN_EXPORT_IMAGE_REPORT?.clear?.();try{await fn()}"
          if old not in s: raise SystemExit('advanced: run anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # Cache-bust loaders and load report UI before exporters.
          p=Path('tour-point-shapes.js')
          s=p.read_text(encoding='utf-8')
          if "png-export-fix.js?v=2" not in s: raise SystemExit('tour-point-shapes png v2 loader missing')
          p.write_text(s.replace("png-export-fix.js?v=2","png-export-fix.js?v=3",1),encoding='utf-8')

          p=Path('export-tools.js')
          s=p.read_text(encoding='utf-8')
          if "advanced-export-tools.js?v=1" not in s: raise SystemExit('advanced exporter v1 loader missing')
          p.write_text(s.replace("advanced-export-tools.js?v=1","advanced-export-tools.js?v=2",1),encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          anchor='<script src="persistence.js?v=3"></script>'
          if anchor not in s: raise SystemExit('index persistence anchor missing')
          if 'export-image-report.js?v=1' not in s:
            s=s.replace(anchor,anchor+'\n<script src="export-image-report.js?v=1"></script>',1)
          s=s.replace('tour-point-shapes.js?v=8','tour-point-shapes.js?v=9',1)
          s=s.replace('export-tools.js?v=7','export-tools.js?v=8',1)
          p.write_text(s,encoding='utf-8')

      - name: Validate JavaScript and loaders
        run: |
          node --check export-image-report.js
          node --check png-export-fix.js
          node --check advanced-export-tools.js
          node --check tour-point-shapes.js
          node --check export-tools.js
          grep -q "imageFailures" png-export-fix.js
          grep -q "__VN_EXPORT_IMAGE_REPORT" advanced-export-tools.js
          grep -q "export-image-report.js?v=1" index.html
          grep -q "tour-point-shapes.js?v=9" index.html
          grep -q "export-tools.js?v=8" index.html
          grep -q "png-export-fix.js?v=3" tour-point-shapes.js
          grep -q "advanced-export-tools.js?v=2" export-tools.js

      - name: Commit diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add png-export-fix.js advanced-export-tools.js tour-point-shapes.js export-tools.js index.html
          git commit -m 'Report failed export image URLs'
          git push
