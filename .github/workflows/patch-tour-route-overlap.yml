name: Patch tour route overlaps

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-tour-route-overlap.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python tools/patch-tour-route-overlap.py
      - name: Validate
        run: |
          node --check tour-route.js
          grep -q 'const DISPLAY_OFFSET=' tour-route.js
          grep -q 'function migrateOverlapOnce' tour-route.js
          grep -q 'id="tourSeparateOverlaps"' tour-route.js
          grep -q "load('tour-route.js?v=6')" index.html
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tour-route.js index.html
          git commit -m 'Separate overlapping tour route markers'
          git push
