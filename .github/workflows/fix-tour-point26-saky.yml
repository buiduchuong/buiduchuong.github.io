name: Fix tour point 26 to Sa Ky

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-tour-point26-saky.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch point 26
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tour-route.js')
          s=p.read_text(encoding='utf-8')
          old="const COORD_MARK='vn-xuyen-viet-route-fixed-33-v1';"
          new=old+"\nconst POINT26_MARK='vn-xuyen-viet-route-point26-saky-v1';"
          if "POINT26_MARK" not in s:
              if old not in s: raise SystemExit('coord mark anchor missing')
              s=s.replace(old,new,1)
          oldpt=" 25:{name:'Đảo Lý Sơn',lat:15.380833,lon:109.117500,note:'Chặng Quảng Ngãi - Sa Kỳ - Lý Sơn'},"
          newpt=" 25:{name:'Cảng Sa Kỳ · Quảng Ngãi',lat:15.214000,lon:108.910000,note:'Điểm tuyến chính trên đất liền; từ Sa Kỳ đoàn đi tàu cao tốc ra Đảo Lý Sơn'},"
          if oldpt in s:
              s=s.replace(oldpt,newpt,1)
          elif newpt not in s:
              raise SystemExit('point 26 anchor missing')
          anchor="function migrateAllPointsOnce(){let done=false;try{done=localStorage.getItem(COORD_MARK)==='done'}catch{}if(done)return;for(let i=0;i<ROUTE.length;i++){const f=FIXED_GEO[i];if(f&&data?.points?.[i])data.points[i]=geoProject(f.lon,f.lat)}save();try{localStorage.setItem(COORD_MARK,'done')}catch{}}"
          add=anchor+"\nfunction migratePoint26Once(){let done=false;try{done=localStorage.getItem(POINT26_MARK)==='done'}catch{}if(done)return;const f=FIXED_GEO[25];if(f&&data?.points?.[25]){data.points[25]=geoProject(f.lon,f.lat);save()}try{localStorage.setItem(POINT26_MARK,'done')}catch{}}"
          if "function migratePoint26Once()" not in s:
              if anchor not in s: raise SystemExit('migration anchor missing')
              s=s.replace(anchor,add,1)
          oldinit="buildBasePoints();load();migrateAllPointsOnce();initLayer();injectUI();render();"
          newinit="buildBasePoints();load();migrateAllPointsOnce();migratePoint26Once();initLayer();injectUI();render();"
          if oldinit in s:
              s=s.replace(oldinit,newinit,1)
          elif newinit not in s:
              raise SystemExit('init anchor missing')
          p.write_text(s,encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if "tour-route.js?v=4" in s:
              s=s.replace("tour-route.js?v=4","tour-route.js?v=5",1)
          elif "tour-route.js?v=5" not in s:
              raise SystemExit('index route loader missing')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          node --check tour-route.js
          grep -q "Cảng Sa Kỳ · Quảng Ngãi" tour-route.js
          grep -q "migratePoint26Once" tour-route.js
          grep -q "tour-route.js?v=5" index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tour-route.js index.html
          git commit -m 'Keep tour point 26 on mainland at Sa Ky'
          git push
