name: Patch tour shape positions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-fix-tour-shape-positions.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python tools/patch-fix-tour-shape-positions.py
      - name: Validate
        run: |
          node --check tour-point-shapes.js
          grep -q "const POSITION_MARK=" tour-point-shapes.js
          grep -q "function fixManagedPositions" tour-point-shapes.js
          grep -q "id='fixTourPointShapePositions'\|id=\"fixTourPointShapePositions\"" tour-point-shapes.js
          grep -q 'tour-point-shapes.js?v=10' index.html
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tour-point-shapes.js index.html
          git commit -m 'Add restore positions for tour image shapes'
          git push
