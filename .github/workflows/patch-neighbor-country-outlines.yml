name: Patch neighbor country outlines

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-neighbor-country-outlines.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply loader patch
        run: python tools/patch-neighbor-country-outlines.py
      - name: Validate
        run: |
          node --check neighbor-country-outlines.js
          grep -q "load('neighbor-country-outlines.js?v=1')" index.html
          ! grep -q "load('international-borders.js?v=1')" index.html
          grep -q "fill:'none'" neighbor-country-outlines.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Replace border lines with neighboring country outlines'
          git push
