name: Patch archipelago loader

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-archipelago-loader.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply loader patch
        run: python tools/patch-archipelago-loader.py
      - name: Validate
        run: |
          node --check archipelago-labels.js
          grep -q "load('archipelago-labels.js?v=1')" index.html
          grep -q "Quần đảo Hoàng Sa" archipelago-labels.js
          grep -q "Quần đảo Trường Sa" archipelago-labels.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load Hoang Sa and Truong Sa labels'
          git push
