name: Patch tour image loader

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/localize-tour-images.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch cache versions
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/tour-point-shapes\.js?v=5/tour-point-shapes.js?v=8/g' index.html
          sed -i 's/tour-point-shapes\.js?v=4/tour-point-shapes.js?v=8/g' export-tools.js
          sed -i 's/Không tải được 20 shape địa điểm hành trình/Không tải được 8 shape địa điểm nổi bật/g' export-tools.js
          grep -n 'tour-point-shapes.js?v=8' index.html export-tools.js

      - name: Commit loader update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html export-tools.js
          if git diff --cached --quiet; then
            echo 'Loader already patched.'
            exit 0
          fi
          git commit -m 'Use local tour photo loader v8'
          git push
