name: Localize tour photos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/localize-tour-images.yml'

permissions:
  contents: write

jobs:
  localize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact tour photos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tour-assets/photos
          UA='Mozilla/5.0 (compatible; NewstartourMap/1.0)'
          curl -L --fail --retry 4 --retry-delay 2 -A "$UA" -o tour-assets/photos/soc-trang.jpg 'https://upload.wikimedia.org/wikipedia/commons/thumb/0/0a/T%C6%B0%E1%BB%A3ng_ph%E1%BA%ADt_n%E1%BA%B1m_t%E1%BA%A1i_S%C3%B3c_Tr%C4%83ng_2.jpg/960px-T%C6%B0%E1%BB%A3ng_ph%E1%BA%ADt_n%E1%BA%B1m_t%E1%BA%A1i_S%C3%B3c_Tr%C4%83ng_2.jpg'
          curl -L --fail --retry 4 --retry-delay 2 -A "$UA" -o tour-assets/photos/bac-lieu.jpg 'https://upload.wikimedia.org/wikipedia/commons/thumb/8/84/Nh%C3%A0_C%C3%B4ng_t%E1%BB%AD_B%E1%BA%A1c_Li%C3%AAu%2C_TX.B%E1%BA%A1c_Li%C3%AAu.jpg/960px-Nh%C3%A0_C%C3%B4ng_t%E1%BB%AD_B%E1%BA%A1c_Li%C3%AAu%2C_TX.B%E1%BA%A1c_Li%C3%AAu.jpg'
          curl -L --fail --retry 4 --retry-delay 2 -A "$UA" -o tour-assets/photos/dat-mui.jpg 'https://upload.wikimedia.org/wikipedia/commons/thumb/7/7b/Tuongdaimuicamau.jpg/960px-Tuongdaimuicamau.jpg'
          curl -L --fail --retry 4 --retry-delay 2 -A "$UA" -o tour-assets/photos/u-minh-thuong.jpg 'https://upload.wikimedia.org/wikipedia/commons/thumb/6/67/U_Minh_Th%C6%B0%E1%BB%A3ng%2C_Ki%C3%AAn_Giang.jpg/960px-U_Minh_Th%C6%B0%E1%BB%A3ng%2C_Ki%C3%AAn_Giang.jpg'
          curl -L --fail --retry 4 --retry-delay 2 -A "$UA" -o tour-assets/photos/ha-tien-thach-dong.jpg 'https://upload.wikimedia.org/wikipedia/commons/0/03/Thachdong.jpg'
          curl -L --fail --retry 4 --retry-delay 2 -A "$UA" -o tour-assets/photos/phu-quoc-dinh-cau.jpg 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c3/Dinh_C%E1%BA%ADu_%E1%BB%9F_Ph%C3%BA_Qu%E1%BB%91c.jpg/960px-Dinh_C%E1%BA%ADu_%E1%BB%9F_Ph%C3%BA_Qu%E1%BB%91c.jpg'
          curl -L --fail --retry 4 --retry-delay 2 -A "$UA" -o tour-assets/photos/tra-su.jpg 'https://upload.wikimedia.org/wikipedia/commons/thumb/2/21/Tr%C3%A0_S%C6%B0_2.jpg/960px-Tr%C3%A0_S%C6%B0_2.jpg'
          curl -L --fail --retry 4 --retry-delay 2 -A "$UA" -o tour-assets/photos/chau-doc-mieu-ba.jpg 'https://upload.wikimedia.org/wikipedia/commons/thumb/9/99/Mi%E1%BA%BFu_B%C3%A0_Ch%C3%BAa_X%E1%BB%A9_N%C3%BAi_Sam.jpg/960px-Mi%E1%BA%BFu_B%C3%A0_Ch%C3%BAa_X%E1%BB%A9_N%C3%BAi_Sam.jpg'
          for f in tour-assets/photos/*.jpg; do
            test -s "$f"
            case "$(file -b --mime-type "$f")" in image/jpeg|image/png|image/webp) ;; *) echo "Invalid image: $f"; exit 1;; esac
          done
          ls -lh tour-assets/photos

      - name: Commit local photo files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tour-assets/photos
          if git diff --cached --quiet; then
            echo 'Photos already localized.'
            exit 0
          fi
          git commit -m 'Store tour photos locally'
          git push
