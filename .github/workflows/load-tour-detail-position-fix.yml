name: Load detail position fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/load-tour-detail-position-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=".then(()=>load('tour-detail-markers.js?v=3')).then(()=>load('export-tools.js?v=8'))"
          new=".then(()=>load('tour-detail-markers.js?v=3')).then(()=>load('tour-detail-position-fix.js?v=1')).then(()=>load('export-tools.js?v=8'))"
          if old not in s: raise SystemExit('loader anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          grep -q 'tour-detail-position-fix.js?v=1' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load real itinerary icon coordinate fix'
          git push
