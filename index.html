</style></head><body><div class="app"><aside class="panel"><h1>Bản đồ Việt Nam</h1><p>Option 1: tất cả tên tỉnh dùng cùng cỡ chữ Roboto Bold, nhỏ gọn và viền chữ mảnh để khu vực phía Bắc dễ nhìn hơn.</p><div class="g"><b>Chỉnh tỉnh</b><select id="sel"></select><div class="row"><input id="fill" type="color" value="#f6d48b"><button class="btn" id="reset">Khôi phục</button></div></div><div class="g"><b>Hiển thị</b><label class="ck"><input id="labels" type="checkbox" checked> Tên tỉnh</label><label class="ck"><input id="routes" type="checkbox" checked> 13 mũi tên về Hà Nội</label><label class="ck"><input id="pickup" type="checkbox" checked> Điểm đón Hà Nội</label><div class="row"><button class="btn red" id="export">Xuất SVG</button><button class="btn" id="fit">Vừa màn hình</button></div></div></aside><main class="work"><div class="bar"><button class="btn" id="zi">＋</button><button class="btn" id="zo">－</button><span id="status">Đang tải…</span></div><div class="canvas" id="cv"><svg id="svg" viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#f9ecd7"/><stop offset="1" stop-color="#f1dcc0"/></linearGradient><linearGradient id="sea" x2="1"><stop stop-color="#bce3f5" stop-opacity="0"/><stop offset="1" stop-color="#65bced" stop-opacity=".76"/></linearGradient><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow stdDeviation="4" flood-color="#ef9fc1" flood-opacity=".78"/></filter><marker id="a" markerWidth="8" markerHeight="8" refX="6.5" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#e51d49"/></marker></defs><rect width="1400" height="1000" fill="url(#paper)"/><rect x="1010" width="390" height="1000" fill="url(#sea)"/><g id="pick"></g><g id="vp"><g id="maps" filter="url(#glow)"></g><g id="rs"></g><g id="ls"></g><g id="mk"></g></g></svg></div></main></div><script>

.c],x=q[0]+(o?o[0]:0),y=q[1]+(o?o[1]:0),L=o?o[2]:lines(m.n),g=E('g',{id:'l'+m.c}),cp=E('clipPath',{id:'c'+m.c});cp.append(E('path',{d}));svg.querySelector('defs').append(cp);g.setAttribute('clip-path','url(#c'+m.c+')');let k=K[m.c],by=y-(L.length-1)*4.2-(k?2.9:0);L.forEach((v,z)=>{let t=E('text',{x,y:by+z*8.1,class:'pn'});t.textContent=v;g.append(t)});if(k){let t=E('text',{x,y:by+L.length*8.1+1.4,class:'km'});t.textContent=k;g.append(t)}ls.append(g);S.lb.set(m.c,g);p.onclick=()=>{$('sel').value=m.c;document.querySelectorAll('.sel').forEach(e=>e.classList.remove('sel'));p.classList.add('sel');$('fill').value=p.getAttribute('fill')};}const bias={'12':-40,'11':-25,'14':25,'15':-18,'08':18,'04':-15,'19':12,'20':22,'25':16,'24':-10,'22':-28,'31':15,'33':24};function routes(){rs.innerHTML='';if(!$('routes').checked)return;let h=S.p.get('01');R.forEach(c=>{let s=S.p.get(c);if(!s)return;let x=s[0]-h[0],y=s[1]-h[1],l=Math.hypot(x,y)||1,e=[h[0]+x/l*16,h[1]+y/l*16],mx=(s[0]+e[0])/2,my=(s[1]+e[1])/2,b=bias[c]||0;rs.append(E('path',{d:`M${s[0]},${s[1]} Q${mx-y/l*b},${my+x/l*b} ${e[0]},${e[1]}`,class:'route'}),E('circle',{cx:s[0],cy:s[1],r:5.1,class:'po'}),E('circle',{cx:s[0],cy:s[1],r:2.5,class:'pi'}))})}function marker(){mk.innerHTML='';let p=S.p.get('01');if(!p)return;mk.append(E('circle',{cx:p[0]+2,cy:p[1]+18,r:10.8,fill:'#e52b3d',stroke:'#fff','stroke-width':2.1}));let st=E('text',{x:p[0]+2,y:p[1]+21,'text-anchor':'middle','font-size':14,fill:'#fff','font-weight':700});st.textContent='★';mk.append(st)}function pickup(){pick.innerHTML='';if(!$('pickup').checked)return;pick.innerHTML='<rect x="36" y="730" width="365" height="205" rx="7" fill="#fff0c9" stroke="#555" stroke-width="3"/><text x="218" y="795" text-anchor="middle" font-family="Roboto" font-size="22" font-weight="700">ĐIỂM ĐÓN TẠI HÀ NỘI</text><text x="56" y="832" font-family="Roboto" font-size="16" font-weight="700">📍 Nhà hát Lớn Hà Nội</text><text x="56" y="865" font-family="Roboto" font-size="16" font-weight="500">◷ Thời gian đón: 05h30</text><text x="56" y="900" font-family="Roboto" font-size="16">Quý khách vui lòng có mặt trước 15 phút.</text>'}function tf(){vp.setAttribute('transform',`translate(${S.t.x} ${S.t.y}) scale(${S.t.k})`)}function zoom(f){S.t.k=Math.max(.6,Math.min(6,S.t.k*f));tf()}async function load(){let n=0;for(let m of P){try{let r=await fetch(m.u),j=await r.json();draw(m,j.features[0],n++)}catch(e){console.log(e)}}routes();marker();pickup();$('status').textContent='Đã tải đủ 34 tỉnh/thành';$('sel').innerHTML=P.map(x=>`<option value="${x.c}">${x.n}</option>`).join('');$('sel').value='01';$('p01').classList.add('sel');$('fill').value=$('p01').getAttribute('fill')}$('sel').onchange=e=>{let p=$('p'+e.target.value);document.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel'));p.classList.add('sel');$('fill').value=p.getAttribute('fill')};$('fill').oninput=e=>$('p'+$('sel').value).setAttribute('fill',e.target.value);$('reset').onclick=()=>{$('p'+$('sel').value).setAttribute('fill',S.st.get($('sel').value));$('fill').value=S.st.get($('sel').value)};$('labels').onchange=e=>ls.classList.toggle('hidden',!e.target.checked);$('routes').onchange=routes;$('pickup').onchange=pickup;$('zi').onclick=()=>zoom(1.2);$('zo').onclick=()=>zoom(.84);$('fit').onclick=()=>{S.t={x:0,y:0,k:1};tf()};$('export').onclick=()=>{let c=svg.cloneNode(true),u=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(c)],{type:'image/svg+xml'})),a=document.createElement('a');a.href=u;a.download='ban-do-viet-nam.svg';a.click();setTimeout(()=>URL.revokeObjectURL(u),500)};svg.onpointerdown=e=>{S.drag=1;S.x=e.clientX;S.y=e.clientY;S.ox=S.t.x;S.oy=S.t.y};svg.onpointermove=e=>{if(!S.drag)return;let r=svg.getBoundingClientRect();S.t.x=S.ox+(e.clientX-S.x)/r.width*1400;S.t.y=S.oy+(e.clientY-S.y)/r.height*1000;tf()};svg.onpointerup=()=>S.drag=0;svg.onwheel=e=>{e.preventDefault();zoom(e.deltaY<0?1.1:.9)};load()})();
