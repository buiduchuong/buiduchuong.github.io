<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bản đồ Việt Nam 34 tỉnh/thành</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--red:#e51d49;--ink:#151515;--paper:#f5e6cf;--panel:#fffdf8;--line:#ddd0bd}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Roboto,Arial,sans-serif;background:#e9ddcb;color:#222}
.app{height:100%;display:grid;grid-template-columns:300px minmax(0,1fr);gap:12px;padding:12px}.panel,.workspace{border-radius:16px;overflow:hidden;box-shadow:0 16px 45px rgba(67,49,29,.13)}
.panel{background:#fffdf8;border:1px solid var(--line);display:flex;flex-direction:column}.head{padding:16px;border-bottom:1px solid var(--line);background:#fff9ef}.head h1{font-size:20px;margin:0 0 6px;font-weight:900}.head p{font-size:11px;line-height:1.5;color:#746a60;margin:0}.controls{padding:12px;display:grid;gap:10px;overflow:auto}.group{border:1px solid var(--line);border-radius:12px;padding:10px;background:white}.group-title{font-weight:900;font-size:12px;text-transform:uppercase;margin-bottom:8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}label{font-size:11px;font-weight:700;color:#5d554e}select,input[type=text]{width:100%;padding:8px;border:1px solid #d7ccbd;border-radius:8px;font-family:Roboto}input[type=color]{width:100%;height:35px;border:1px solid #d7ccbd;border-radius:8px;background:white}.check{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:11px;font-weight:700}.btn{border:1px solid #d6cab9;background:white;border-radius:8px;padding:8px 9px;font-family:Roboto;font-weight:700;font-size:11px;cursor:pointer}.btn.primary{background:var(--red);border-color:var(--red);color:white}.selected{margin-top:8px;background:#fff1f4;border:1px solid #f1beca;padding:8px;border-radius:9px;font-size:11px;line-height:1.5}.selected b{font-size:14px}.tip{font-size:10.5px;line-height:1.45;color:#746a60;margin-top:8px}
.workspace{position:relative;background:var(--paper);border:1px solid rgba(100,70,40,.12)}.toolbar{height:52px;display:flex;gap:7px;align-items:center;padding:8px 10px;background:rgba(255,253,248,.96);border-bottom:1px solid var(--line);position:relative;z-index:5}.spacer{flex:1}.badge{font-size:10px;font-weight:700;padding:6px 9px;border-radius:999px;background:#fff0f3;color:#a71c3e}.canvas{position:absolute;inset:52px 0 0;overflow:hidden;touch-action:none}.canvas svg{width:100%;height:100%;display:block;user-select:none}.province{cursor:pointer;vector-effect:non-scaling-stroke;transition:.15s}.province:hover{filter:brightness(.96) saturate(1.08)}.province.active{stroke:#d91343!important;stroke-width:2.3!important}.province.hidden{opacity:.08;pointer-events:none}
.province-name,.province-distance{font-family:Roboto,Arial,sans-serif;text-anchor:middle;pointer-events:none}.province-name{font-weight:700;font-size:14px;fill:#111;stroke:none;letter-spacing:0}.province-distance{font-weight:700;fill:#333;stroke:none}.label-group.hidden{display:none}.route{fill:none;stroke:var(--red);stroke-width:2;vector-effect:non-scaling-stroke;marker-end:url(#arrow)}.pin-o{fill:#fff8ea;stroke:var(--red);stroke-width:1.8;vector-effect:non-scaling-stroke}.pin-i{fill:var(--red)}
.tooltip{position:absolute;opacity:0;pointer-events:none;background:#211d19;color:#fff;padding:6px 8px;border-radius:7px;font-size:11px;font-weight:700;transform:translate(10px,10px);z-index:20}.loading{position:absolute;inset:0;z-index:15;background:rgba(247,235,216,.95);display:grid;place-items:center}.load-card{background:#fffdf8;border:1px solid #dccfbf;border-radius:14px;padding:18px;width:min(420px,88%);text-align:center}.bar{height:8px;background:#eadfce;border-radius:999px;overflow:hidden;margin:11px 0}.bar>div{height:100%;width:0;background:var(--red);transition:.2s}
@media(max-width:850px){.app{grid-template-columns:1fr;height:auto;padding:7px}.workspace{height:76vh;min-height:620px}}
</style>
</head>
<body>
<div class="app">
<aside class="panel">
  <div class="head"><h1>Bản đồ Việt Nam</h1><p>Tất cả tên tỉnh dùng Google Roboto Bold 14px, không viền.</p></div>
  <div class="controls">
    <div class="group"><div class="group-title">Chọn tỉnh / thành</div><input id="search" type="text" placeholder="Tìm tỉnh/thành..."><select id="provinceSelect" size="7" style="margin-top:7px"></select><div id="selectedCard" class="selected">Chưa chọn tỉnh.</div></div>
    <div class="group"><div class="group-title">Màu tỉnh</div><div class="row"><div><label>Màu nền</label><input id="fillColor" type="color" value="#f6d48b"></div><div><label>Màu viền</label><input id="strokeColor" type="color" value="#40464b"></div></div><label class="check"><input id="showSelectedLabel" type="checkbox" checked> Hiện tên tỉnh</label><label class="check"><input id="hideSelected" type="checkbox"> Ẩn tỉnh</label><div class="row"><button id="exportSelected" class="btn primary">Xuất SVG tỉnh</button><button id="resetSelected" class="btn">Khôi phục tỉnh</button></div></div>
    <div class="group"><div class="group-title">Infographic</div><label class="check"><input id="showLabels" type="checkbox" checked> Hiện tên tỉnh</label><label class="check"><input id="showRoutes" type="checkbox" checked> 13 mũi tên về Hà Nội</label><label class="check"><input id="showKm" type="checkbox" checked> Hiện khoảng cách ≈ KM</label><label class="check"><input id="showPickup" type="checkbox" checked> Hiện ô điểm đón Hà Nội</label><div class="row"><button id="exportAll" class="btn primary">Xuất bản đồ SVG</button><button id="resetAll" class="btn">Khôi phục tất cả</button></div><div class="tip"><b>Roboto Bold 14px.</b> Tắt khoảng cách chỉ ẩn chữ ≈ KM; chấm đỏ của tuyến vẫn giữ nguyên.</div></div>
  </div>
</aside>
<main class="workspace">
  <div class="toolbar"><button id="zoomIn" class="btn">＋ Zoom</button><button id="zoomOut" class="btn">－ Zoom</button><button id="fitMap" class="btn">Vừa màn hình</button><div class="spacer"></div><span id="badge" class="badge">Đang tải…</span></div>
  <div id="canvas" class="canvas">
    <svg id="mapSvg" viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg">
      <defs id="defs">
        <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f9ecd7"/><stop offset="1" stop-color="#f1dcc0"/></linearGradient>
        <linearGradient id="sea" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#bce3f5" stop-opacity="0"/><stop offset="1" stop-color="#65bced" stop-opacity=".78"/></linearGradient>
        <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ef9fc1" flood-opacity=".8"/></filter>
        <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L7 3.5L0 7Z" fill="#e51d49"/></marker>
      </defs>
      <rect width="1400" height="1000" fill="url(#paper)"/><rect x="1010" width="390" height="1000" fill="url(#sea)"/>
      <g id="pickupLayer"></g><g id="viewport"><g id="mapLayer" filter="url(#glow)"></g><g id="routeLayer"></g><g id="labelLayer"></g><g id="markerLayer"></g></g>
    </svg>
    <div id="tooltip" class="tooltip"></div>
    <div id="loading" class="loading"><div class="load-card"><b>Đang tải ranh giới 34 tỉnh/thành</b><div class="bar"><div id="progress"></div></div><div id="progressText">0 / 34</div></div></div>
  </div>
</main>
</div>
<script>
(()=>{
'use strict';
const NS='http://www.w3.org/2000/svg',BASE='https://raw.githubusercontent.com/thanglequoc/vietnamese-provinces-database/master/json/geojson';
const provinces=[['01','ha_noi','Hà Nội'],['04','cao_bang','Cao Bằng'],['08','tuyen_quang','Tuyên Quang'],['11','dien_bien','Điện Biên'],['12','lai_chau','Lai Châu'],['14','son_la','Sơn La'],['15','lao_cai','Lào Cai'],['19','thai_nguyen','Thái Nguyên'],['20','lang_son','Lạng Sơn'],['22','quang_ninh','Quảng Ninh'],['24','bac_ninh','Bắc Ninh'],['25','phu_tho','Phú Thọ'],['31','hai_phong','Hải Phòng'],['33','hung_yen','Hưng Yên'],['37','ninh_binh','Ninh Bình'],['38','thanh_hoa','Thanh Hóa'],['40','nghe_an','Nghệ An'],['42','ha_tinh','Hà Tĩnh'],['44','quang_tri','Quảng Trị'],['46','hue','Huế'],['48','da_nang','Đà Nẵng'],['51','quang_ngai','Quảng Ngãi'],['52','gia_lai','Gia Lai'],['56','khanh_hoa','Khánh Hòa'],['66','dak_lak','Đắk Lắk'],['68','lam_dong','Lâm Đồng'],['75','dong_nai','Đồng Nai'],['79','ho_chi_minh','TP. Hồ Chí Minh'],['80','tay_ninh','Tây Ninh'],['82','dong_thap','Đồng Tháp'],['86','vinh_long','Vĩnh Long'],['91','an_giang','An Giang'],['92','can_tho','Cần Thơ'],['96','ca_mau','Cà Mau']].map(([code,slug,name])=>({code,slug,name,url:`${BASE}/${code}_${slug}/${code}_${slug}.geojson`}));
const km={'04':'≈ 280 KM','08':'≈ 130 KM','11':'≈ 455 KM','12':'≈ 450 KM','14':'≈ 320 KM','15':'≈ 290 KM','19':'≈ 75 KM','20':'≈ 155 KM','22':'≈ 200 KM','24':'≈ 40 KM','25':'≈ 90 KM','31':'≈ 120 KM','33':'≈ 60 KM'};
const routes=['08','04','12','15','19','11','20','14','25','24','22','31','33'],routeSet=new Set(routes),palette=['#f9d69a','#d9edb7','#ffeaa2','#f8c9aa','#cfe6b5','#efc6e7','#f0dda4','#bfe3cf','#f8c8a4'];
const GEO={minLon:101.7,maxLon:110.7,minLat:7.4,maxLat:23.7},PLOT={x:350,y:18,w:700,h:954};
const state={selected:null,features:new Map(),styles:new Map(),labels:new Map(),points:new Map(),layout:new Map(),transform:{x:0,y:0,k:1},drag:false,start:null};
const $=id=>document.getElementById(id),svg=$('mapSvg'),defs=$('defs'),viewport=$('viewport'),mapLayer=$('mapLayer'),labelLayer=$('labelLayer'),routeLayer=$('routeLayer'),markerLayer=$('markerLayer'),pickupLayer=$('pickupLayer'),tooltip=$('tooltip');
const el=(tag,a={})=>{const n=document.createElementNS(NS,tag);Object.entries(a).forEach(([k,v])=>n.setAttribute(k,v));return n};
function project([lon,lat]){return[PLOT.x+(lon-GEO.minLon)/(GEO.maxLon-GEO.minLon)*PLOT.w,PLOT.y+(GEO.maxLat-lat)/(GEO.maxLat-GEO.minLat)*PLOT.h]}
function ringPath(r){return r&&r.length?'M'+r.map((p,i)=>{const[x,y]=project(p);return`${i?'L':''}${x.toFixed(2)},${y.toFixed(2)}`}).join('')+'Z':''}
function pathData(g){if(g.type==='Polygon')return g.coordinates.map(ringPath).join('');if(g.type==='MultiPolygon')return g.coordinates.flatMap(p=>p.map(ringPath)).join('');return''}
function projectedOuterRings(g){if(g.type==='Polygon')return[g.coordinates[0].map(project)];if(g.type==='MultiPolygon')return g.coordinates.map(p=>p[0].map(project));return[]}
function ringArea(r){let a=0;for(let i=0,j=r.length-1;i<r.length;j=i++)a+=r[j][0]*r[i][1]-r[i][0]*r[j][1];return Math.abs(a/2)}
function largestRing(g){return projectedOuterRings(g).sort((a,b)=>ringArea(b)-ringArea(a))[0]||[]}
function bboxRing(r){let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;r.forEach(([x,y])=>{minX=Math.min(minX,x);minY=Math.min(minY,y);maxX=Math.max(maxX,x);maxY=Math.max(maxY,y)});return{minX,minY,maxX,maxY,w:maxX-minX,h:maxY-minY,cx:(minX+maxX)/2,cy:(minY+maxY)/2}}
function pointInRing(p,r){let inside=false;for(let i=0,j=r.length-1;i<r.length;j=i++){const xi=r[i][0],yi=r[i][1],xj=r[j][0],yj=r[j][1];if(((yi>p[1])!==(yj>p[1]))&&(p[0]<(xj-xi)*(p[1]-yi)/(yj-yi)+xi))inside=!inside}return inside}
function segDist(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1];if(!dx&&!dy)return Math.hypot(p[0]-a[0],p[1]-a[1]);let t=((p[0]-a[0])*dx+(p[1]-a[1])*dy)/(dx*dx+dy*dy);t=Math.max(0,Math.min(1,t));return Math.hypot(p[0]-(a[0]+t*dx),p[1]-(a[1]+t*dy))}
function edgeDist(p,r){let d=Infinity;for(let i=0,j=r.length-1;i<r.length;j=i++)d=Math.min(d,segDist(p,r[j],r[i]));return d}
function candidatePoints(r){const b=bboxRing(r),arr=[];for(let iy=1;iy<30;iy++)for(let ix=1;ix<30;ix++){const p=[b.minX+b.w*ix/30,b.minY+b.h*iy/30];if(pointInRing(p,r)){const d=edgeDist(p,r),centerPenalty=Math.hypot(p[0]-b.cx,p[1]-b.cy)*.018;arr.push({p,score:d-centerPenalty})}}arr.sort((a,b)=>b.score-a.score);return arr}
function rectFits(cx,cy,w,h,r){const xs=[-.5,-.25,0,.25,.5],ys=[-.5,-.25,0,.25,.5];for(const xx of xs)for(const yy of ys)if(!pointInRing([cx+xx*w,cy+yy*h],r))return false;return true}
function splitName(name,code){const up=name.toUpperCase();const manual={'01':['HÀ NỘI'],'08':['TUYÊN','QUANG'],'19':['THÁI','NGUYÊN'],'24':['BẮC','NINH'],'31':['HẢI','PHÒNG'],'33':['HƯNG','YÊN'],'37':['NINH','BÌNH'],'48':['ĐÀ','NẴNG'],'51':['QUẢNG','NGÃI'],'56':['KHÁNH','HÒA'],'79':['TP. HỒ CHÍ','MINH'],'82':['ĐỒNG','THÁP'],'86':['VĨNH','LONG'],'91':['AN','GIANG'],'92':['CẦN','THƠ']};if(manual[code])return manual[code];const words=up.split(' ');if(words.length<=2)return[up];let best=[up],bestDiff=Infinity;for(let i=1;i<words.length;i++){const a=words.slice(0,i).join(' '),b=words.slice(i).join(' '),d=Math.abs(a.length-b.length);if(d<bestDiff){best=[a,b];bestDiff=d}}return best}
function estimateWidth(lines,fs,distFs,hasKm){const name=Math.max(...lines.map(s=>s.length))*fs*.57;const dist=hasKm?(12*distFs*.51):0;return Math.max(name,dist)}
function fitLabel(meta,g){const r=largestRing(g),b=bboxRing(r),cands=candidatePoints(r),lines=splitName(meta.name,meta.code),hasKm=!!km[meta.code],fs=14,distFs=8;const pinD=hasKm?9:0,nameH=lines.length*fs*.95,distH=hasKm?distFs*1.15:0,gap=hasKm?4:0,h=nameH+pinD+distH+gap+3,w=estimateWidth(lines,fs,distFs,hasKm)+7;for(const c of cands.slice(0,220)){if(rectFits(c.p[0],c.p[1],w,h,r))return{p:c.p,fs,distFs,lines,w,h}}const p=cands[0]?.p||[b.cx,b.cy];return{p,fs,distFs,lines,w,h}}
function styleFor(i,code){return{fill:code==='01'?'#efc1df':palette[i%palette.length],stroke:'#40464b',hidden:false,showLabel:true}}
function addClip(code,d){const cp=el('clipPath',{id:`clip-${code}`,clipPathUnits:'userSpaceOnUse'});cp.appendChild(el('path',{d,'fill-rule':'evenodd'}));defs.appendChild(cp)}
function drawProvince(meta,feature,index){const d=pathData(feature.geometry),p=el('path',{id:`province-${meta.code}`,d,'fill-rule':'evenodd',class:'province'});mapLayer.appendChild(p);addClip(meta.code,d);state.features.set(meta.code,{meta,feature});state.styles.set(meta.code,styleFor(index,meta.code));
  const L=fitLabel(meta,feature.geometry);state.layout.set(meta.code,L);state.points.set(meta.code,L.p);const g=el('g',{id:`label-${meta.code}`,class:'label-group','clip-path':`url(#clip-${meta.code})`});const top=L.p[1]-L.h/2+L.fs*.82;
  L.lines.forEach((line,i)=>{const t=el('text',{x:L.p[0],y:top+i*L.fs*.97,class:'province-name','font-size':'14'});t.textContent=line;g.appendChild(t)});
  if(km[meta.code]){const pinY=top+L.lines.length*L.fs*.97+2;g.append(el('circle',{cx:L.p[0],cy:pinY,r:4.2,class:'pin-o'}),el('circle',{cx:L.p[0],cy:pinY,r:2.2,class:'pin-i'}));const dt=el('text',{x:L.p[0],y:pinY+6.3+L.distFs*.72,class:'province-distance','font-size':L.distFs});dt.textContent=km[meta.code];g.appendChild(dt);L.routePoint=[L.p[0],pinY]}
  labelLayer.appendChild(g);state.labels.set(meta.code,g);if(!$('showKm').checked)g.querySelectorAll('.province-distance').forEach(n=>n.style.display='none');apply(meta.code);p.addEventListener('click',e=>{e.stopPropagation();select(meta.code)});p.addEventListener('pointermove',e=>showTip(e,meta.name));p.addEventListener('pointerleave',()=>tooltip.style.opacity=0)
}
function apply(code){const p=$(`province-${code}`),s=state.styles.get(code),l=state.labels.get(code);if(!p||!s)return;p.setAttribute('fill',s.fill);p.setAttribute('stroke',s.stroke);p.setAttribute('stroke-width','.9');p.classList.toggle('hidden',s.hidden);if(l)l.classList.toggle('hidden',!$('showLabels').checked||!s.showLabel||s.hidden)}
function select(code){state.selected=code;document.querySelectorAll('.province.active').forEach(x=>x.classList.remove('active'));const p=$(`province-${code}`);if(p)p.classList.add('active');$('provinceSelect').value=code;sync()}
function sync(){if(!state.selected)return;const f=state.features.get(state.selected),s=state.styles.get(state.selected);$('selectedCard').innerHTML=`<b>${f.meta.name}</b><br>Mã tỉnh: ${f.meta.code}`;$('fillColor').value=s.fill;$('strokeColor').value=s.stroke;$('showSelectedLabel').checked=s.showLabel;$('hideSelected').checked=s.hidden}
function populate(q=''){const s=$('provinceSelect'),cur=state.selected,t=q.trim().toLocaleLowerCase('vi');s.innerHTML='';provinces.filter(p=>p.name.toLocaleLowerCase('vi').includes(t)).forEach(p=>{const o=document.createElement('option');o.value=p.code;o.textContent=`${p.code} — ${p.name}`;s.appendChild(o)});if(cur)s.value=cur}
function showTip(e,text){const r=$('canvas').getBoundingClientRect();tooltip.textContent=text;tooltip.style.left=e.clientX-r.left+'px';tooltip.style.top=e.clientY-r.top+'px';tooltip.style.opacity=1}
function applyKmVisibility(){const on=$('showKm').checked;document.querySelectorAll('.province-distance').forEach(n=>n.style.display=on?'':'none')}
const bias={'12':-40,'11':-25,'14':25,'15':-18,'08':18,'04':-15,'19':12,'20':22,'25':16,'24':-10,'22':-28,'31':15,'33':24};
function drawRoutes(){routeLayer.innerHTML='';if(!$('showRoutes').checked||!state.points.has('01'))return;const h=state.points.get('01');routes.forEach(code=>{const L=state.layout.get(code),s=L?.routePoint||state.points.get(code);if(!s)return;const vx=s[0]-h[0],vy=s[1]-h[1],len=Math.hypot(vx,vy)||1,ex=h[0]+vx/len*13,ey=h[1]+vy/len*13,mx=(s[0]+ex)/2,my=(s[1]+ey)/2,px=-vy/len,py=vx/len,b=bias[code]||0;routeLayer.appendChild(el('path',{d:`M${s[0]},${s[1]} Q${mx+px*b},${my+py*b} ${ex},${ey}`,class:'route'}))})}
function star(cx,cy,r1,r2){const a=[];for(let i=0;i<10;i++){const ang=-Math.PI/2+i*Math.PI/5,r=i%2?r2:r1;a.push(`${cx+Math.cos(ang)*r},${cy+Math.sin(ang)*r}`)}return a.join(' ')}
function drawHanoi(){markerLayer.innerHTML='';const L=state.layout.get('01');if(!L)return;const[x,y]=L.p,cy=y+Math.min(9,L.h*.25);markerLayer.append(el('circle',{cx:x,cy,r:7.6,fill:'#e52b3d',stroke:'#fff','stroke-width':'1.8'}),el('polygon',{points:star(x,cy,4.4,1.9),fill:'#fff'}))}
function drawPickup(){pickupLayer.innerHTML='';if(!$('showPickup').checked)return;const g=el('g');g.append(el('rect',{x:36,y:730,width:365,height:205,rx:7,fill:'#fff0c9',stroke:'#555','stroke-width':'3'}),el('circle',{cx:83,cy:728,r:18,fill:'#ed6b75',stroke:'#555','stroke-width':'4'}),el('path',{d:'M96 741L116 762',stroke:'#555','stroke-width':'6','stroke-linecap':'round'}));const title=el('text',{x:218,y:795,'text-anchor':'middle','font-family':'Roboto','font-size':'22','font-weight':'700'});title.textContent='ĐIỂM ĐÓN TẠI HÀ NỘI';g.appendChild(title);[['📍  Nhà hát Lớn Hà Nội',832,'700'],['◷  Thời gian đón: 05h30',865,'700'],['Quý khách vui lòng có mặt trước 15 phút.',900,'500']].forEach(([tx,y,w])=>{const t=el('text',{x:56,y,'font-family':'Roboto','font-size':'16','font-weight':w});t.textContent=tx;g.appendChild(t)});pickupLayer.appendChild(g)}
function updateTransform(){const t=state.transform;viewport.setAttribute('transform',`translate(${t.x} ${t.y}) scale(${t.k})`)}function zoom(f,cx=700,cy=500){const t=state.transform,nk=Math.max(.55,Math.min(7,t.k*f)),wx=(cx-t.x)/t.k,wy=(cy-t.y)/t.k;t.x=cx-wx*nk;t.y=cy-wy*nk;t.k=nk;updateTransform()}function fit(){state.transform={x:0,y:0,k:1};updateTransform()}
function download(data,name){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([data],{type:'image/svg+xml'}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),800)}
function exportCss(){return'<style>.province-name,.province-distance{font-family:Roboto,Arial,sans-serif;text-anchor:middle}.province-name{font-weight:700;font-size:14px;fill:#111;stroke:none}.province-distance{font-weight:700;fill:#333;stroke:none}.route{fill:none;stroke:#e51d49;stroke-width:2}</style>'}
function exportAll(){const c=svg.cloneNode(true);c.querySelectorAll('.active').forEach(x=>x.classList.remove('active'));c.insertAdjacentHTML('afterbegin',exportCss());download(new XMLSerializer().serializeToString(c),'ban-do-viet-nam-infographic.svg')}
function exportSelected(){if(!state.selected)return;const p=$(`province-${state.selected}`),l=state.labels.get(state.selected),m=state.features.get(state.selected).meta,b=p.getBBox(),pad=15;download(`<svg xmlns="${NS}" viewBox="${b.x-pad} ${b.y-pad} ${b.width+pad*2} ${b.height+pad*2}">${exportCss()}<defs><clipPath id="clip-${m.code}"><path d="${p.getAttribute('d')}" fill-rule="evenodd"/></clipPath></defs><rect x="${b.x-pad}" y="${b.y-pad}" width="${b.width+pad*2}" height="${b.height+pad*2}" fill="#fff8e9"/>${p.outerHTML.replace(' active','')}${l?.outerHTML||''}</svg>`,`${m.code}-${m.slug}.svg`)}
function resetSelected(){if(!state.selected)return;const i=provinces.findIndex(p=>p.code===state.selected);state.styles.set(state.selected,styleFor(i,state.selected));apply(state.selected);sync()}function resetAll(){provinces.forEach((p,i)=>{state.styles.set(p.code,styleFor(i,p.code));apply(p.code)});sync()}
async function loadAll(){let done=0,failed=[];const q=[...provinces],workers=Array.from({length:6},async()=>{while(q.length){const meta=q.shift();try{const r=await fetch(meta.url,{cache:'force-cache'});if(!r.ok)throw Error(r.status);const gj=await r.json(),feature=gj.features?.[0];if(!feature)throw Error('empty');drawProvince(meta,feature,provinces.findIndex(p=>p.code===meta.code))}catch(e){failed.push(meta.name);console.error(meta.name,e)}done++;$('progress').style.width=done/provinces.length*100+'%';$('progressText').textContent=`${done} / ${provinces.length}`}});await Promise.all(workers);drawRoutes();drawHanoi();drawPickup();applyKmVisibility();$('loading').style.display='none';$('badge').textContent=failed.length?`Đã tải ${34-failed.length}/34 tỉnh`:'Đã tải đủ 34 tỉnh/thành';if(!failed.length)select('01');if(failed.length)alert('Không tải được: '+failed.join(', '))}
populate();$('provinceSelect').addEventListener('change',e=>select(e.target.value));$('search').addEventListener('input',e=>populate(e.target.value));$('fillColor').addEventListener('input',e=>{if(!state.selected)return;state.styles.get(state.selected).fill=e.target.value;apply(state.selected)});$('strokeColor').addEventListener('input',e=>{if(!state.selected)return;state.styles.get(state.selected).stroke=e.target.value;apply(state.selected)});$('showSelectedLabel').addEventListener('change',e=>{if(!state.selected)return;state.styles.get(state.selected).showLabel=e.target.checked;apply(state.selected)});$('hideSelected').addEventListener('change',e=>{if(!state.selected)return;state.styles.get(state.selected).hidden=e.target.checked;apply(state.selected)});$('showLabels').addEventListener('change',()=>provinces.forEach(p=>apply(p.code)));$('showRoutes').addEventListener('change',drawRoutes);$('showKm').addEventListener('change',applyKmVisibility);$('showPickup').addEventListener('change',drawPickup);$('resetSelected').addEventListener('click',resetSelected);$('resetAll').addEventListener('click',resetAll);$('exportAll').addEventListener('click',exportAll);$('exportSelected').addEventListener('click',exportSelected);$('zoomIn').addEventListener('click',()=>zoom(1.22));$('zoomOut').addEventListener('click',()=>zoom(.82));$('fitMap').addEventListener('click',fit);
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect(),cx=(e.clientX-r.left)/r.width*1400,cy=(e.clientY-r.top)/r.height*1000;zoom(e.deltaY<0?1.12:.89,cx,cy)},{passive:false});svg.addEventListener('pointerdown',e=>{if(e.button!==0)return;state.drag=true;state.start={x:e.clientX,y:e.clientY,tx:state.transform.x,ty:state.transform.y};svg.setPointerCapture(e.pointerId)});svg.addEventListener('pointermove',e=>{if(!state.drag)return;const r=svg.getBoundingClientRect();state.transform.x=state.start.tx+(e.clientX-state.start.x)/r.width*1400;state.transform.y=state.start.ty+(e.clientY-state.start.y)/r.height*1000;updateTransform()});svg.addEventListener('pointerup',e=>{state.drag=false;try{svg.releasePointerCapture(e.pointerId)}catch{}});svg.addEventListener('dblclick',fit);
loadAll();
})();
